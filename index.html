<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шлях героя</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="scene">
    <div class="mist mist-one"></div>
    <div class="mist mist-two"></div>
    <div class="crest"></div>

    <div class="game-shell">
      <div class="topbar">
        <span class="badge">Quest</span>
        <span class="status">Code City</span>
      </div>

      <div class="content">
        <div class="hero-copy">
          <p class="eyebrow">Серія 01 / Підземелля</p>
          <h1>Шлях героя</h1>
          <p class="subtitle">
            Місто в темряві. Порожні вулиці, глухий ліс, забуті коридори і таємниці, які чекають на сміливця.
          </p>

          <div class="cta-row">
            <button class="primary" type="button">Розпочати</button>
            <button class="secondary" type="button">Легенда</button>
          </div>
        </div>

        <aside class="quest-panel">
          <div class="panel-header">Місія</div>

          <ul class="mission-list">
            <li>Обрати клас героя</li>
            <li>Відкрити таємний шлях</li>
            <li>Подолати пастки</li>
            <li>Взяти скарб</li>
          </ul>

          <div class="stats">
            <div class="stat-box">
              <span>Рівень</span>
              <strong>1</strong>
            </div>
            <div class="stat-box">
              <span>Небезпека</span>
              <strong>Висока</strong>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
